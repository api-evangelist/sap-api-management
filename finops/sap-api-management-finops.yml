description: FOCUS-aligned FinOps placeholder for SAP API Management. The service is consumed via BTP entitlements and SAP does not publish a public rate card.
sources:
  - https://help.sap.com/docs/integration-suite
  - https://www.sap.com/products/business-technology-platform/integration-suite/api-management.html
notes: Provider does not publish a public, machine-readable rate card; meters and FOCUS columns below are placeholders to be reconciled once contract or partner-portal terms are available.
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: SAP SE
serviceCategory: API Management
billingModel:
  pricingCategory: Enterprise Contract
  billingFrequency: Per-Invoice
  billingCurrency: USD/EUR/varies
  chargeCategories:
    - Purchase
    - Usage
    - Tax
    - Adjustment
focusColumns:
  ServiceName: SAP API Management
  ServiceCategory: API Management
  ProviderName: SAP API Management
  PublisherName: SAP SE
  InvoiceIssuerName: SAP SE
  BillingCurrency: USD
meters:
  - name: contracted_consumption
    description: Consumption against the customer's negotiated SAP / Concur contract; reconcile to actual
      provider-published meters once available.
    unit: varies
    aggregation: sum
    dimensions:
      - service
      - region
principles:
  - name: Visibility
    description: Use SAP for Me, the BTP Cockpit, or the SAP Concur admin console (as applicable) to
      view consumption against entitlements; line items appear on the SAP / Concur invoice.
  - name: Allocation
    description: Allocate by SAP global account / subaccount or by Concur entity; map to internal cost
      centers via the relevant cockpit before chargeback.
  - name: Optimization
    description: Track CPEA/BTPEA balance burn or per-employee subscription utilization; right-size service
      plans and prune unused entitlements at renewal.
  - name: Accountability
    description: Designate a single billing owner and reconcile invoices monthly with usage reports from
      the relevant SAP / Concur cockpit.
maintainers:

naftiko: "1.0.0-alpha1"

info:
  label: "SAP API Management Portal API"
  description: >-
    Provides programmatic management of SAP API Management entities including
    API providers, proxies, products, applications, developers, and key-value
    maps via the API Portal OData management service.
  tags:
    - API Lifecycle
    - Developer Portal
    - SAP BTP
    - API Management
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      SAP_APIMGMT_CLIENT_ID: SAP_APIMGMT_CLIENT_ID
      SAP_APIMGMT_CLIENT_SECRET: SAP_APIMGMT_CLIENT_SECRET
      SAP_APIMGMT_TENANT_URL: SAP_APIMGMT_TENANT_URL

capability:
  consumes:
    - type: http
      namespace: api-portal
      baseUri: https://{{SAP_APIMGMT_TENANT_URL}}/apiportal/api/1.0/Management.svc
      description: "SAP API Management OData management service for CRUD operations on API entities"
      authentication:
        type: bearer
        token: "{{SAP_APIMGMT_ACCESS_TOKEN}}"
      resources:
        - name: api-providers
          path: /APIProviders
          description: "Backend system provider management"
          operations:
            - name: list-api-providers
              method: GET
              description: "List all registered API providers"
              inputParameters:
                - name: $top
                  in: query
                  type: integer
                  required: false
                - name: $filter
                  in: query
                  type: string
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: create-api-provider
              method: POST
              description: "Register a new backend system as an API provider"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  host: "{{tools.host}}"
                  description: "{{tools.description}}"

            - name: get-api-provider
              method: GET
              description: "Get details of a specific API provider"
              inputParameters:
                - name: name
                  in: path
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: delete-api-provider
              method: DELETE
              description: "Delete a registered API provider"
              inputParameters:
                - name: name
                  in: path
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: api-proxies
          path: /APIProxies
          description: "API proxy lifecycle management"
          operations:
            - name: list-api-proxies
              method: GET
              description: "List all API proxies"
              inputParameters:
                - name: $top
                  in: query
                  type: integer
                  required: false
                - name: $filter
                  in: query
                  type: string
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: create-api-proxy
              method: POST
              description: "Create a new API proxy"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  basepath: "{{tools.basepath}}"
                  title: "{{tools.title}}"
                  description: "{{tools.description}}"

            - name: get-api-proxy
              method: GET
              description: "Get details of a specific API proxy"
              inputParameters:
                - name: name
                  in: path
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: delete-api-proxy
              method: DELETE
              description: "Delete an API proxy"
              inputParameters:
                - name: name
                  in: path
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: api-products
          path: /APIProducts
          description: "API product catalog management"
          operations:
            - name: list-api-products
              method: GET
              description: "List all API products"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: create-api-product
              method: POST
              description: "Create a new API product"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  title: "{{tools.title}}"
                  description: "{{tools.description}}"
                  scope: "{{tools.scope}}"

            - name: delete-api-product
              method: DELETE
              description: "Delete an API product"
              inputParameters:
                - name: name
                  in: path
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: applications
          path: /Applications
          description: "Developer application management"
          operations:
            - name: list-applications
              method: GET
              description: "List all registered developer applications"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: key-value-maps
          path: /KeyValueMaps
          description: "Runtime configuration key-value store management"
          operations:
            - name: list-key-value-maps
              method: GET
              description: "List all key-value maps"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: create-key-value-map
              method: POST
              description: "Create a new key-value map"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  encrypted: "{{tools.encrypted}}"

  exposes:
    - type: rest
      port: 8100
      namespace: api-portal-api
      resources:
        - path: /v1/api-proxies
          operations:
            - method: GET
              name: list-api-proxies
              description: "List all API proxies"
              call: "api-portal.list-api-proxies"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/api-products
          operations:
            - method: GET
              name: list-api-products
              description: "List all API products"
              call: "api-portal.list-api-products"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: api-portal-mcp
      transport: http
      tools:
        - name: list-api-proxies
          description: "List all API proxies in SAP API Management"
          hints:
            readOnly: true
            openWorld: false
          call: "api-portal.list-api-proxies"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-api-products
          description: "List all API products in SAP API Management"
          hints:
            readOnly: true
            openWorld: false
          call: "api-portal.list-api-products"
          outputParameters:
            - type: object
              mapping: "$."

        - name: create-api-proxy
          description: "Create a new API proxy in SAP API Management"
          hints:
            readOnly: false
            destructive: false
          call: "api-portal.create-api-proxy"
          outputParameters:
            - type: object
              mapping: "$."

        - name: create-api-product
          description: "Create a new API product bundle in SAP API Management"
          hints:
            readOnly: false
            destructive: false
          call: "api-portal.create-api-product"
          outputParameters:
            - type: object
              mapping: "$."

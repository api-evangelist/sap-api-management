naftiko: 1.0.0-alpha2
info:
  label: SAP API Management API Portal API — API Providers
  description: 'SAP API Management API Portal API — API Providers. 5 operations. Lead operation: List API Providers. Self-contained
    Naftiko capability covering one Sap Api Management business surface.'
  tags:
  - Sap Api Management
  - API Providers
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SAP_API_MANAGEMENT_API_KEY: SAP_API_MANAGEMENT_API_KEY
capability:
  consumes:
  - type: http
    namespace: portal-api-providers
    baseUri: https://{tenantUrl}/apiportal/api/1.0/Management.svc
    description: SAP API Management API Portal API — API Providers business capability. Self-contained, no shared references.
    resources:
    - name: APIProviders
      path: /APIProviders
      operations:
      - name: listapiproviders
        method: GET
        description: List API Providers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: $filter
          in: query
          type: string
          description: OData filter expression
        - name: $top
          in: query
          type: integer
          description: Maximum number of records to return
        - name: $skip
          in: query
          type: integer
          description: Number of records to skip for pagination
        - name: $select
          in: query
          type: string
          description: Comma-separated list of properties to return
      - name: createapiprovider
        method: POST
        description: Create API Provider
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: APIProviders('{name}')
      path: /APIProviders('{name}')
      operations:
      - name: getapiprovider
        method: GET
        description: Get API Provider
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: path
          type: string
          description: API provider name
          required: true
      - name: updateapiprovider
        method: PUT
        description: Update API Provider
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleteapiprovider
        method: DELETE
        description: Delete API Provider
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.SAP_API_MANAGEMENT_API_KEY}}'
  exposes:
  - type: rest
    namespace: portal-api-providers-rest
    port: 8080
    description: REST adapter for SAP API Management API Portal API — API Providers. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/apiproviders
      name: apiproviders
      description: REST surface for APIProviders.
      operations:
      - method: GET
        name: listapiproviders
        description: List API Providers
        call: portal-api-providers.listapiproviders
        with:
          $filter: rest.$filter
          $top: rest.$top
          $skip: rest.$skip
          $select: rest.$select
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createapiprovider
        description: Create API Provider
        call: portal-api-providers.createapiprovider
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/apiproviders-name
      name: apiproviders-name
      description: REST surface for APIProviders('{name}').
      operations:
      - method: GET
        name: getapiprovider
        description: Get API Provider
        call: portal-api-providers.getapiprovider
        with:
          name: rest.name
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updateapiprovider
        description: Update API Provider
        call: portal-api-providers.updateapiprovider
        with:
          name: rest.name
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteapiprovider
        description: Delete API Provider
        call: portal-api-providers.deleteapiprovider
        with:
          name: rest.name
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: portal-api-providers-mcp
    port: 9090
    transport: http
    description: MCP adapter for SAP API Management API Portal API — API Providers. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: list-api-providers
      description: List API Providers
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: portal-api-providers.listapiproviders
      with:
        $filter: tools.$filter
        $top: tools.$top
        $skip: tools.$skip
        $select: tools.$select
      outputParameters:
      - type: object
        mapping: $.
    - name: create-api-provider
      description: Create API Provider
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: portal-api-providers.createapiprovider
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-api-provider
      description: Get API Provider
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: portal-api-providers.getapiprovider
      with:
        name: tools.name
      outputParameters:
      - type: object
        mapping: $.
    - name: update-api-provider
      description: Update API Provider
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: portal-api-providers.updateapiprovider
      with:
        name: tools.name
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-api-provider
      description: Delete API Provider
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: portal-api-providers.deleteapiprovider
      with:
        name: tools.name
      outputParameters:
      - type: object
        mapping: $.

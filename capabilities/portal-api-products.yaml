naftiko: 1.0.0-alpha2
info:
  label: SAP API Management API Portal API — API Products
  description: 'SAP API Management API Portal API — API Products. 4 operations. Lead operation: List API Products. Self-contained
    Naftiko capability covering one Sap Api Management business surface.'
  tags:
  - Sap Api Management
  - API Products
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SAP_API_MANAGEMENT_API_KEY: SAP_API_MANAGEMENT_API_KEY
capability:
  consumes:
  - type: http
    namespace: portal-api-products
    baseUri: https://{tenantUrl}/apiportal/api/1.0/Management.svc
    description: SAP API Management API Portal API — API Products business capability. Self-contained, no shared references.
    resources:
    - name: APIProducts
      path: /APIProducts
      operations:
      - name: listapiproducts
        method: GET
        description: List API Products
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: $filter
          in: query
          type: string
        - name: $top
          in: query
          type: integer
        - name: $skip
          in: query
          type: integer
      - name: createapiproduct
        method: POST
        description: Create API Product
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: APIProducts('{name}')
      path: /APIProducts('{name}')
      operations:
      - name: getapiproduct
        method: GET
        description: Get API Product
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: path
          type: string
          required: true
      - name: deleteapiproduct
        method: DELETE
        description: Delete API Product
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.SAP_API_MANAGEMENT_API_KEY}}'
  exposes:
  - type: rest
    namespace: portal-api-products-rest
    port: 8080
    description: REST adapter for SAP API Management API Portal API — API Products. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/apiproducts
      name: apiproducts
      description: REST surface for APIProducts.
      operations:
      - method: GET
        name: listapiproducts
        description: List API Products
        call: portal-api-products.listapiproducts
        with:
          $filter: rest.$filter
          $top: rest.$top
          $skip: rest.$skip
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createapiproduct
        description: Create API Product
        call: portal-api-products.createapiproduct
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/apiproducts-name
      name: apiproducts-name
      description: REST surface for APIProducts('{name}').
      operations:
      - method: GET
        name: getapiproduct
        description: Get API Product
        call: portal-api-products.getapiproduct
        with:
          name: rest.name
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteapiproduct
        description: Delete API Product
        call: portal-api-products.deleteapiproduct
        with:
          name: rest.name
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: portal-api-products-mcp
    port: 9090
    transport: http
    description: MCP adapter for SAP API Management API Portal API — API Products. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: list-api-products
      description: List API Products
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: portal-api-products.listapiproducts
      with:
        $filter: tools.$filter
        $top: tools.$top
        $skip: tools.$skip
      outputParameters:
      - type: object
        mapping: $.
    - name: create-api-product
      description: Create API Product
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: portal-api-products.createapiproduct
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-api-product
      description: Get API Product
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: portal-api-products.getapiproduct
      with:
        name: tools.name
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-api-product
      description: Delete API Product
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: portal-api-products.deleteapiproduct
      with:
        name: tools.name
      outputParameters:
      - type: object
        mapping: $.

openapi: 3.0.3
info:
  title: SAP API Management API Portal API Products Applications API
  description: 'The SAP API Management API Portal API provides RESTful endpoints built on OData principles for programmatically managing API proxies, API products, applications, developers, policies, and key-value maps within the SAP API Management platform. Authentication uses OAuth 2.0 with credentials from the service key generated for the API Portal Access Plan. The base URL is tenant-specific: https://{tenant-url}/apiportal/api/1.0/Management.svc.'
  version: '1.0'
  contact:
    name: SAP API Management Support
    url: https://help.sap.com/docs/sap-api-management
  license:
    name: SAP Terms
    url: https://www.sap.com/about/agreements/policies/cloud-platform.html
servers:
- url: https://{tenantUrl}/apiportal/api/1.0/Management.svc
  description: SAP API Management API Portal OData service
  variables:
    tenantUrl:
      description: Your SAP BTP tenant-specific URL
      default: your-tenant.cfapps.sap.hana.ondemand.com
security:
- OAuth2: []
tags:
- name: Applications
  description: Developer applications consuming API products
paths:
  /Applications:
    get:
      operationId: listApplications
      summary: List Applications
      description: Retrieve all developer applications registered in the platform.
      tags:
      - Applications
      parameters:
      - name: $filter
        in: query
        schema:
          type: string
      - name: $top
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: List of applications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationsResponse'
    post:
      operationId: createApplication
      summary: Create Application
      description: Register a new developer application.
      tags:
      - Applications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationInput'
      responses:
        '201':
          description: Application created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
components:
  schemas:
    ApplicationInput:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        description:
          type: string
        developerId:
          type: string
    ApplicationsResponse:
      type: object
      properties:
        d:
          type: object
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/Application'
    Application:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        developerId:
          type: string
        status:
          type: string
          enum:
          - Approved
          - Pending
          - Revoked
        createdAt:
          type: string
          format: date-time
  securitySchemes:
    OAuth2:
      type: oauth2
      description: OAuth 2.0 authentication using SAP BTP service key credentials
      flows:
        clientCredentials:
          tokenUrl: https://{tenantUrl}/oauth/token
          scopes:
            apiportal.access: Full access to API Management portal

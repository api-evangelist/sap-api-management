- aid: sap-api-management:sap-api-management-analytics
  name: SAP API Management Analytics API
  description: The SAP API Management Analytics API provides access to API usage metrics, performance statistics,
    error rates, and traffic analytics for APIs managed on the SAP API Management platform. It supports building
    custom dashboards and monitoring integrations using aggregated and raw usage data.
  humanURL: https://help.sap.com/docs/sap-api-management/sap-api-management/analyze-apis

aid: sap-api-management
name: SAP API Management
description: SAP API Management is an API platform that enables organizations to design, import, publish, secure,
  and monitor APIs. It provides a self-service developer portal (API Business Hub Enterprise), OpenAPI-based API
  design tools, policy management, and access to the SAP Business Accelerator Hub for discovering and consuming
  SAP and partner APIs.

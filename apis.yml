- aid: sap-api-management:sap-api-business-hub-enterprise
  name: SAP API Business Hub Enterprise API
  description: The SAP API Business Hub Enterprise (also called API Management Developer Portal) API enables programmatic
    management of the self-service developer portal. It supports managing API catalog content, developer registrations,
    application subscriptions, and portal customizations for consumer-facing API discovery and consumption.
  humanURL: https://help.sap.com/docs/sap-api-management/sap-api-management/consume-apis
  tags:
